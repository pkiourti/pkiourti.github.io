  contents:
    - title: Senior AI Scientist (promoted from AI Scientist after 3 months)
      institution: SmileShape, Remote, USA
      year: Jan&nbsp;2026 – Present
      description:
        - Built an automated ML pipeline that turns 3D jaw scans into mill-ready denture designs in under 2 minutes per case, down from about 40 minutes of manual design (20× faster).
        - Trained 2D and 3D keypoint detection models that locate landmarks directly on 3D jaw meshes, with symmetry and arch-shape constraints for anatomically consistent output.
        - Trained 3D tooth segmentation models (PointNet++, Point Transformer, VMNet) via self-training, bootstrapping pseudo-labels with the Segment Anything Model (SAM) and iteratively refining them.
        - Automated tooth setup, placing and scaling a tooth library along the detected arch and aligning the bite between upper and lower dentures.
        - Developed geometry pipelines that sculpt realistic denture-base anatomy (mesh displacement, remeshing, surface fitting) with parametric depth controls.
        - Built milling manufacturability checks, detecting unreachable pockets, generating groove tool paths, and smoothing regions narrower than the milling ball.

